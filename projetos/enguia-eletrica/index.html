<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>enguia elétrica — como o peixe produz eletricidade</title>
  <style>
    html, body { margin: 0; background: #0e3640; overflow: hidden; }
    #quadro { display: block; width: 1080px; height: 1920px; }
    #linhaDagua { position: fixed; left: 0; width: 1080px; height: 2px; pointer-events: none;
      background: linear-gradient(90deg, rgba(220,235,240,.15), rgba(235,245,248,.55), rgba(220,235,240,.15)); }
  </style>
  <script type="importmap">
    { "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
  </script>
</head>
<body>
<div id="linhaDagua"></div>
<script type="module">
  // Enguia elétrica — "Como um peixe consegue produzir eletricidade dentro do próprio corpo?"
  // Tudo segue a narração (transcricao.json): cada cena começa no início exato da frase falada.
  import { criarEstudio, registrar } from '/motor/estudio.js';
  import { PALETA as P, HACHURA, criarCeu, criarCorte, criarTexto, hachuraDe } from '/motor/estilo.js';
  import { carregarNarracao } from '/motor/narracao.js';
  import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

  const N = await carregarNarracao('transcricao.json');
  const T = N.duracao;                 // 62,85 s: o vídeo tem exatamente a duração do áudio
  const F = N.frases.map((f) => f.ini); // início de cada frase
  const w = (p, n = 0) => N.w(p, n);    // início de uma palavra
  const wf = (p, n = 0) => N.w(p, n, 'fim');

  const { THREE, renderer, cena, camera } = criarEstudio({ fundo: P.ceuTopo, fov: 50 });
  renderer.localClippingEnabled = true;
  const texto = criarTexto();
  const linhaDagua = document.getElementById('linhaDagua');

  // ---------- utilidades determinísticas ----------
  let semente = 11;
  const rnd = () => ((semente = (semente * 16807) % 2147483647) / 2147483647);
  const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
  function ruido(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  const fbm = (x, y) => ruido(x, y) * 0.55 + ruido(x * 2.1, y * 2.1) * 0.3 + ruido(x * 4.3, y * 4.3) * 0.15;
  const suave = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const per = (ciclos) => (2 * Math.PI * ciclos) / T; // frequência que fecha ciclos inteiros no vídeo (loop perfeito)
  const std = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, metalness: 0, ...o });

  // ---------- céu, ar e água ----------
  const ceu = criarCeu(cena, 300);
  { // reflexos suaves do céu (só um toque)
    const pm = new THREE.PMREMGenerator(renderer);
    const sc = new THREE.Scene(); criarCeu(sc, 50);
    cena.environment = pm.fromScene(sc, 0.04).texture;
    cena.environmentIntensity = 0.35;
  }
  const nevoaAr = new THREE.FogExp2('#3a4a6c', 0.02);
  const nevoaAgua = new THREE.FogExp2('#1b4c55', 0.115);
  const COR_AGUA = new THREE.Color('#1b4c55');
  const hemiAr = new THREE.HemisphereLight(0x9cb2e0, 0x2c3140, 1.5); cena.add(hemiAr);
  const hemiAgua = new THREE.HemisphereLight(0x86bfc6, 0x5a6650, 3.0); cena.add(hemiAgua);
  const luaFria = new THREE.DirectionalLight(0x9db4ff, 0.5); luaFria.position.set(-6, 9, -8); cena.add(luaFria);
  const ceuNaAgua = new THREE.DirectionalLight(0xa9d4da, 0); ceuNaAgua.position.set(0.6, 6, 3); cena.add(ceuNaAgua); // céu filtrado pela superfície

  const superficie = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), std('#16263a', { roughness: 0.12, metalness: 0.2 }));
  superficie.rotation.x = -Math.PI / 2; cena.add(superficie);
  const superficieBaixo = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshBasicMaterial({ color: '#6aa8ae', side: THREE.BackSide }));
  superficieBaixo.rotation.x = -Math.PI / 2; superficieBaixo.position.y = -0.001; cena.add(superficieBaixo);

  // ---------- leito do rio ----------
  const fundoY = (x, z) => -1.52 + (fbm(x * 0.55 + 3, z * 0.55) - 0.5) * 0.32 - Math.max(0, -z - 3) * 0.12
    + suave(1.2, 0.4, Math.hypot(x * 0.6, z)) * 0.0; // perto da enguia o fundo é calmo
  {
    const g = new THREE.PlaneGeometry(70, 70, 220, 220); g.rotateX(-Math.PI / 2);
    const pos = g.attributes.position, cores = [];
    const areia = new THREE.Color('#7b6b52'), lodo = new THREE.Color('#3f3a2e'), cascalho = new THREE.Color('#6a6255');
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i);
      pos.setY(i, fundoY(x, z));
      const n = fbm(x * 1.7, z * 1.7), m = ruido(x * 6, z * 6);
      const c = areia.clone().lerp(lodo, suave(0.35, 0.75, n)).lerp(cascalho, m * 0.3);
      cores.push(c.r, c.g, c.b);
    }
    g.setAttribute('color', new THREE.Float32BufferAttribute(cores, 3)); g.computeVertexNormals();
    const leito = new THREE.Mesh(g, std('#ffffff', { vertexColors: true, roughness: 1 })); leito.receiveShadow = true; cena.add(leito);
  }
  const corPedras = ['#5c5448', '#6b6355', '#4a453d', '#575049'];
  function pedra(x, z, s, achatar = 0.6) {
    const g = new THREE.IcosahedronGeometry(s, 2), p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const v = new THREE.Vector3().fromBufferAttribute(p, i);
      v.multiplyScalar(1 + (ruido(v.x * 4 / s + x, v.y * 4 / s + z) - 0.5) * 0.45); v.y *= achatar; p.setXYZ(i, v.x, v.y, v.z);
    }
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, std(corPedras[Math.floor(rnd() * 4)], { flatShading: true, roughness: 0.95 }));
    m.position.set(x, fundoY(x, z) + s * achatar * 0.35, z); m.rotation.y = rnd() * 6;
    m.castShadow = m.receiveShadow = true; cena.add(m); return m;
  }
  for (let i = 0; i < 46; i++) {
    const x = -7 + rnd() * 14, z = -8 + rnd() * 9.5;
    if (Math.abs(z) < 0.7 && Math.abs(x) < 1.8) continue; // espaço da enguia
    if (z > 0.6 && Math.abs(x - 0.2) < 1.3) continue;      // frente da câmera
    pedra(x, z, 0.08 + rnd() * rnd() * 0.7);
  }
  const pedraCamarao = pedra(-1.28, -0.28, 0.2, 0.55); // a toca do camarão (cena dos pulsos fracos)
  pedra(2.3, -1.0, 0.32); pedra(-1.9, -0.8, 0.42); pedra(2.4, 0.3, 0.18);
  { // folhas no fundo (serrapilheira)
    const n = 700, g = new THREE.CircleGeometry(0.035, 7); g.rotateX(-Math.PI / 2); g.scale(1, 1, 2.2);
    const m = new THREE.InstancedMesh(g, std('#ffffff', { roughness: 1, side: THREE.DoubleSide }), n);
    const tons = ['#5a3d22', '#6e4a28', '#4a3520', '#7a5a33', '#3f3022'].map((c) => new THREE.Color(c));
    const q = new THREE.Object3D();
    for (let i = 0; i < n; i++) {
      const x = -5 + rnd() * 10, z = -5 + rnd() * 6.5;
      q.position.set(x, fundoY(x, z) + 0.004, z); q.rotation.set((rnd() - 0.5) * 0.4, rnd() * 6.3, (rnd() - 0.5) * 0.4);
      q.scale.setScalar(0.6 + rnd() * 0.9); q.updateMatrix(); m.setMatrixAt(i, q.matrix); m.setColorAt(i, tons[i % 5]);
    }
    m.receiveShadow = true; cena.add(m);
  }
  { // troncos submersos
    const casca = std('#3b2f25', { roughness: 0.95 });
    const tronco = (x, z, comp, r, ry, rz) => {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.8, r, comp, 12), casca);
      m.position.set(x, fundoY(x, z) + r * 0.7, z); m.rotation.set(0, ry, Math.PI / 2 + rz); m.castShadow = m.receiveShadow = true; cena.add(m);
      return m;
    };
    tronco(-0.4, -1.5, 3.6, 0.13, 0.35, 0.05);
    tronco(-0.9, -1.75, 1.1, 0.05, -0.6, 0.7);
    tronco(2.6, -2.6, 2.4, 0.1, -0.5, 0.1);
  }
  // plantas (fitas que balançam devagar)
  const plantas = [];
  {
    const mat = std('#3d5a3a', { roughness: 0.8, side: THREE.DoubleSide });
    const mat2 = std('#4e6b40', { roughness: 0.8, side: THREE.DoubleSide });
    const touceira = (cx, cz, n) => {
      for (let i = 0; i < n; i++) {
        const h = 0.35 + rnd() * 0.7, g = new THREE.PlaneGeometry(0.022, h, 1, 10); g.translate(0, h / 2, 0);
        const m = new THREE.Mesh(g, i % 2 ? mat : mat2);
        const x = cx + (rnd() - 0.5) * 0.4, z = cz + (rnd() - 0.5) * 0.3;
        m.position.set(x, fundoY(x, z), z); m.rotation.y = rnd() * 3; m.castShadow = true; cena.add(m);
        plantas.push({ m, base: g.attributes.position.array.slice(), fase: rnd() * 6.3, h });
      }
    };
    touceira(-2.3, -0.4, 9); touceira(2.0, -1.0, 8); touceira(-1.5, -2.4, 10); touceira(1.1, -2.8, 7);
    touceira(-3.2, 0.6, 8); touceira(3.0, 0.9, 7); touceira(0.2, -3.6, 9);
  }
  // partículas em suspensão
  const particulas = (() => {
    const n = 900, pos = new Float32Array(n * 3), base = [];
    for (let i = 0; i < n; i++) base.push([-4 + rnd() * 8, -1.55 + rnd() * 1.5, -5 + rnd() * 8.5, rnd() * 6.3]);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const m = new THREE.Points(g, new THREE.PointsMaterial({ color: '#a9cfc6', size: 0.008, transparent: true, opacity: 0.45, depthWrite: false }));
    cena.add(m);
    return { m, base, atualizar(t) {
      base.forEach(([x, y, z, f], i) => { pos[i * 3] = x + Math.sin(per(1) * t + f) * 0.05; pos[i * 3 + 1] = y + Math.sin(per(2) * t + f * 1.3) * 0.03; pos[i * 3 + 2] = z; });
      g.attributes.position.needsUpdate = true;
    } };
  })();
  // cardume ao longe
  const cardume = (() => {
    const n = 26, g = new THREE.ConeGeometry(0.012, 0.06, 5); g.rotateZ(-Math.PI / 2);
    const m = new THREE.InstancedMesh(g, std('#9fb3b5', { metalness: 0.5, roughness: 0.4 }), n); cena.add(m);
    const q = new THREE.Object3D(), d = Array.from({ length: n }, () => [rnd() * 6.3, (rnd() - 0.5) * 0.4, (rnd() - 0.5) * 0.3]);
    return { atualizar(t) {
      d.forEach(([f, dy, dr], i) => {
        const a = per(3) * t + f * 0.25;
        q.position.set(-0.8 + Math.cos(a) * (1.6 + dr), -0.75 + dy + Math.sin(a * 2) * 0.05, -4.2 + Math.sin(a) * (0.6 + dr));
        q.rotation.set(0, -a, 0); q.updateMatrix(); m.setMatrixAt(i, q.matrix);
      });
      m.instanceMatrix.needsUpdate = true;
    } };
  })();

  // ---------- margem (acima d'água) ----------
  {
    const terra = std('#1b261f', { roughness: 1 });
    const margem = new THREE.Mesh(new THREE.BoxGeometry(120, 1.4, 8), terra); margem.position.set(0, -0.2, -40); cena.add(margem);
    const copa = [std('#1d3124', { flatShading: true }), std('#24392a', { flatShading: true }), std('#1a2b22', { flatShading: true })];
    for (let i = 0; i < 70; i++) {
      const x = -45 + i * 1.3 + rnd(), z = -38 - rnd() * 5, h = 3.5 + rnd() * 5;
      if (rnd() < 0.3) { // açaizeiro
        const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.09, h * 1.2, 6), std('#3a352c')); tr.position.set(x, h * 0.6, z); cena.add(tr);
        for (let k = 0; k < 9; k++) {
          const f = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 2.2), copa[k % 3]); f.material.side = THREE.DoubleSide;
          f.position.set(x, h * 1.2, z); f.rotation.set(0.9 + rnd() * 0.4, (k / 9) * 6.3, 0); f.translateY(0.9); cena.add(f);
        }
      } else {
        for (let k = 0; k < 3; k++) {
          const c = new THREE.Mesh(new THREE.IcosahedronGeometry(h * 0.22 * (0.8 + rnd() * 0.4), 1), copa[(i + k) % 3]);
          c.position.set(x + (rnd() - 0.5) * 2, h * (0.7 + rnd() * 0.3), z + (rnd() - 0.5) * 2); cena.add(c);
        }
      }
    }
    // palafita com janela acesa
    const casa = new THREE.Group(); casa.position.set(-9, 0, -36); cena.add(casa);
    const mad = std('#4a3b2e');
    const caixa = (w, h, d, x, y, z, m = mad) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); casa.add(b); return b; };
    caixa(4, 2.4, 3, 0, 2.6, 0);
    for (const [x, z] of [[-1.8, -1.3], [1.8, -1.3], [-1.8, 1.3], [1.8, 1.3]]) caixa(0.15, 1.6, 0.15, x, 0.6, z);
    const tel = caixa(4.6, 0.12, 3.6, 0, 4.05, 0, std('#3a2e26')); tel.rotation.x = 0.12;
    caixa(0.7, 0.6, 0.05, -0.8, 2.7, 1.53, new THREE.MeshStandardMaterial({ color: '#2a1a10', emissive: P.janela, emissiveIntensity: 1.0 }));
    caixa(0.7, 0.6, 0.05, 0.9, 2.7, 1.53, new THREE.MeshStandardMaterial({ color: '#2a1a10', emissive: P.janela, emissiveIntensity: 0.6 }));
  }

  // ---------- canoa com lamparina (luz-chave prática) ----------
  const canoa = new THREE.Group(); canoa.position.set(1.0, 0, -2.4); cena.add(canoa);
  {
    const madeira = std('#5a3b28', { roughness: 0.7, side: THREE.DoubleSide });
    const casco = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), madeira);
    casco.scale.set(1.7, 0.34, 0.4); casco.position.y = 0.12; casco.castShadow = true; canoa.add(casco);
    const borda = new THREE.Mesh(new THREE.TorusGeometry(1, 0.02, 6, 64), std('#4a3020')); borda.rotation.x = Math.PI / 2; borda.scale.set(1.7, 0.4, 1); borda.position.y = 0.12; canoa.add(borda);
    for (const x of [-0.7, 0.15, 0.95]) { const b = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.025, 0.66), madeira); b.position.set(x, 0.06, 0); canoa.add(b); }
    const remo = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 1.6, 6), madeira); remo.rotation.z = 1.35; remo.position.set(-0.2, 0.14, 0.12); canoa.add(remo);
    const vara = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.75, 6), std('#3a2a1e')); vara.position.set(1.3, 0.45, 0); canoa.add(vara);
  }
  const lamparina = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.05, 0.12, 14), new THREE.MeshStandardMaterial({ color: '#fff0d8', emissive: P.luzQuente, emissiveIntensity: 1.3 }));
  lamparina.position.set(1.3, 0.86, 0); canoa.add(lamparina);
  const luzLamparina = new THREE.PointLight(P.luzQuente, 1.6, 8, 2); luzLamparina.position.set(1.3, 0.9, 0); canoa.add(luzLamparina);
  const fachoAgua = new THREE.SpotLight('#ffc98a', 60, 9, 0.55, 0.9, 1.6); // a luz da lamparina entrando na água
  fachoAgua.position.set(2.3, 0.8, -2.4); fachoAgua.target.position.set(0.2, -1.55, 0.1);
  fachoAgua.castShadow = true; fachoAgua.shadow.mapSize.set(2048, 2048); fachoAgua.shadow.bias = -0.0003; fachoAgua.shadow.radius = 5;
  cena.add(fachoAgua, fachoAgua.target);

  // instrumento dos pesquisadores (cena 3): maleta com visor + dois eletrodos na água
  const instrumento = new THREE.Group(); cena.add(instrumento);
  const visor = (() => {
    const cv = document.createElement('canvas'); cv.width = 512; cv.height = 224;
    const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace;
    let ultimo = '';
    return { tx, escrever(s, aceso) {
      const chave = s + aceso; if (chave === ultimo) return; ultimo = chave;
      const g = cv.getContext('2d'); g.fillStyle = '#0d1210'; g.fillRect(0, 0, 512, 224);
      g.fillStyle = aceso ? P.ambar : '#c9d6c8'; g.font = "500 132px 'IBM Plex Mono'"; g.textAlign = 'right'; g.textBaseline = 'middle';
      g.fillText(s, 470, 120); g.fillStyle = 'rgba(243,237,224,.55)'; g.font = "500 30px 'IBM Plex Mono'"; g.textAlign = 'left'; g.fillText('VOLTS · PICO', 30, 34);
      tx.needsUpdate = true;
    } };
  })();
  {
    const maleta = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.22, 0.4), std('#3d4038', { roughness: 0.6 })); maleta.position.set(1.15, 0.18, -2.4); instrumento.add(maleta);
    const tampa = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.36, 0.03), std('#3d4038', { roughness: 0.6 })); tampa.position.set(1.15, 0.45, -2.59); tampa.rotation.x = -0.25; instrumento.add(tampa);
    const tela = new THREE.Mesh(new THREE.PlaneGeometry(0.54, 0.236), new THREE.MeshStandardMaterial({ map: visor.tx, emissiveMap: visor.tx, emissive: '#ffffff', emissiveIntensity: 0.9, roughness: 0.3 }));
    tela.position.set(1.15, 0.46, -2.573); tela.rotation.x = -0.25; instrumento.add(tela);
    const cabo = (a, b, c) => { const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([a, b, c]), 40, 0.006, 6), std('#1c1c1c', { roughness: 0.5 })); instrumento.add(m); };
    for (const [x, cor] of [[1.05, '#b23a2a'], [-0.75, '#1d1d1d']]) {
      const haste = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 1.35, 8), std('#8a8f94', { metalness: 0.8, roughness: 0.3 })); haste.position.set(x, -0.37, 0.32); instrumento.add(haste);
      const ponta = new THREE.Mesh(new THREE.SphereGeometry(0.022, 12, 8), std(cor, { metalness: 0.5, roughness: 0.35 })); ponta.position.set(x, -1.04, 0.32); instrumento.add(ponta);
      cabo(new THREE.Vector3(1.15 + (x > 0 ? 0.22 : -0.22), 0.22, -2.2), new THREE.Vector3((x + 1.15) / 2, 0.5, -1.0), new THREE.Vector3(x, 0.3, 0.32));
    }
  }

  // ---------- a enguia ----------
  const ENG = { L: 1.8, R: 0.066, x0: 0.9, y: -1.3 };
  const Y = ENG.y;
  const pose = { amp: 0, fase: 0, dz: 0, giro: 0, j: 0 };
  // pose "J": cauda no fundo e metade da frente subindo (como quando vai respirar na superfície)
  const J = { xCauda: -0.85, reta: 0.36, raio: 0.28 };
  function centroJ(s) {
    const d = (1 - s) * ENG.L, a = J.reta * ENG.L, arco = J.raio * Math.PI / 2;
    if (d <= a) return new THREE.Vector3(J.xCauda + d, Y, 0);
    if (d <= a + arco) { const th = (d - a) / J.raio; return new THREE.Vector3(J.xCauda + a + Math.sin(th) * J.raio, Y + (1 - Math.cos(th)) * J.raio, 0); }
    const r2 = d - a - arco; return new THREE.Vector3(J.xCauda + a + J.raio - r2 * 0.12, Y + J.raio + r2, 0);
  }
  const raio = (s) => s < 0.08 ? ENG.R * Math.pow(s / 0.08, 0.45) : s < 0.45 ? ENG.R : ENG.R * Math.max(0.03, 1 - Math.pow((s - 0.45) / 0.55, 1.35) * 0.97);
  const largura = (s) => s < 0.1 ? 1.0 - s * 1.8 : 0.82 - (s - 0.1) * 0.42; // cabeça larga, cauda achatada dos lados
  const altura = (s) => s < 0.1 ? 0.85 + s * 2.7 : 1.12 + (s - 0.1) * 0.1;
  function centro(s) {
    if (pose.j >= 1) return centroJ(s);
    const A = pose.amp * (0.12 + 0.88 * s * s);
    const x = ENG.x0 - s * ENG.L;
    const z = pose.dz + A * Math.sin(2 * Math.PI * (1.25 * s - pose.fase));
    const v = new THREE.Vector3(x, ENG.y, z);
    if (pose.giro) { // curva para o lado (virando)
      const ang = pose.giro * (1 - s) * (1 - s) * 1.2; const px = ENG.x0 - 0.2;
      const dx = v.x - px, dz2 = v.z; v.x = px + dx * Math.cos(ang) - dz2 * Math.sin(ang); v.z = dx * Math.sin(ang) + dz2 * Math.cos(ang);
    }
    return v;
  }
  function referencial(s) {

  registrar({ duracao: T, renderer, cena, camera, desenhar, renderizar, cenas: CENAS, async preparar() { await texto.carregarFontes(); } });
</script>
